services:
  api:
    build:
      context: ./backend
    container_name: ai-inspection-api
    ports:
      - "8001:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-inspection-frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
